<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biblioteca Digital</title>
<style>body{font-family:Arial,sans-serif;max-width:1000px;margin:35px auto;padding:0 20px;color:#1e293b}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:2px solid #2563eb;padding-bottom:12px}a{color:#1d4ed8}button,.btn{background:#2563eb;color:white;padding:9px 13px;border:0;border-radius:5px;cursor:pointer;text-decoration:none;display:inline-block}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}input{padding:8px;max-width:100%}.errorlist{color:#b91c1c}.msg{background:#ecfdf5;padding:10px}</style></head><body>
<header><h1>Biblioteca Digital</h1><nav>{% if user.is_authenticated %}Hola, {{ user.username }} · <a href="{% url 'biblioteca:lista' %}">Libros</a> {% if user.is_staff %}· <a href="/admin/">Admin</a>{% endif %} · <form action="{% url 'biblioteca:logout' %}" method="post" style="display:inline">{% csrf_token %}<button type="submit">Salir</button></form>{% else %}<a href="{% url 'biblioteca:login' %}">Ingresar</a> · <a href="{% url 'biblioteca:registro' %}">Registrarse</a>{% endif %}</nav></header>
{% for message in messages %}<p class="msg">{{ message }}</p>{% endfor %}
<main>{% block contenido %}{% endblock %}</main></body></html>
